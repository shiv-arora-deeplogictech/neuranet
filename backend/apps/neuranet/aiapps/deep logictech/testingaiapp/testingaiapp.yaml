# This YAML file is the core of any AI application. The ID in the file, the file name and the hosting folder must
# match. The file documents rest of the commands and syntax.

---
id: testingaiapp            # the AI application name / ID
interface:                                  # the interface details
  type: announcementagentassist                    # this is for the frontend can be chat, translate or search interfaces
  label: NT ANNOUNCEMENT DOC AI                        # the label for the app icon on the UI
  icon: data:image/svg+xml;base64,
  skippable_file_patterns: 
    - ^_neuranet_generated?.+
    - ^\.system?.+
endpoint: llmflow                           # the API endpoint - usually llmflow
users: ["*"]                                # the * means all users, else must be an array of user IDs
admins: ["thecompany@tekmonks.com"]         # the admins for this app - they can train for example
api_uploads_cms_path: uploads               # where files are uploaded by index, unindex APIs
generated_files_path: _neuranet_generated   # where generated files are placed
ai_cost_quota: 0.6                          # cost quota for the users, -1 disables checks also
disable_quota_checks: true                  # disable quotas if true
disable_model_usage_logging: true           # if true, ai model usage logging
default_embeddings_model: embedding-openai  # model for embedding file ingestion
ingestiondbs: ["nntfidfdb", "nnvectordb"]   # the ingestion databases

# all flows are sequence of commands which follow the same syntax - command, in, out - in is the input
# to the command, out is the variable holding the output and name points to the command module and entry
# point. the command sytax is documented below as well.



llm_flow: 
  - command: llmgptchat                     # default function entry is answer so entry function name is skipped
    in: 
      session_id: "{{{request.session_id}}}" 
      auto_summary: false                   # controls session auto-summary, setting to true will lead to random errors but shorter sessions        
      question: "{{{query}}}"
      files_js: return request.files        # _js means evaluate Javascript to find the value
      aiappid: "{{{aiappid}}}"
      current_date_js: return (new Date()).toISOString().split('T')[0];  # current date in YYYY-MM-DD format
      prompt_noinflate: |                   # means do not inflate this at the flow engine - the calling command will use it as is
        {{#files.length}}Files attached:{{/files.length}}
        {{#files}}
        Filename: {{{filename}}}
        {{{text}}}

        {{/files}}
        Current Date is : {{{current_date}}}
        User's response: {{{question}}}
      prompt_zh_noinflate: |
        {{#files.length}}文件附加:{{/files.length}}
        {{#files}}
        文件名: {{{filename}}}
        {{{text}}}

        {{/files}}

        {{{question}}}
      prompt_ja_noinflate: |                   
        {{#files.length}}ファイル添付:{{/files.length}}
        {{#files}}
        ファイル名: {{{filename}}}
        {{{text}}}

        {{/files}}

        {{{question}}}
      prompt_hi_noinflate: |                   
        {{#files.length}}फाइलें:{{/files.length}}
        {{#files}}
        फ़ाइल नाम: {{{filename}}}
        {{{text}}}

        {{/files}}

        {{{question}}}
      prompt_th_noinflate: |
        {{#files.length}}สิทธิ์:{{/files.length}} 
        {{#files}} 
        ชื่อไฟล์: {{{filename}}} 
        {{{text}}} 

        {{/files}}
        วันที่ปัจจุบันคือ : {{{current_date}}} 

        ตอบกลับของผู้ใช้: {{{question}}}

        คำตอบเป็นภาษาไทยคือ:
      model: 
        name: chat-openai
    out: airesponse                         # the final response must output to this property - airesponse for LLM flows

  - command: sanitizejson.parse                     # default function entry is answer so entry function name is skipped
    in: 
      airesponse_js: return airesponse;  
    out: airesponse

global_models:
  - name: chat-openai
    model_overrides:                    
      read_ai_response_from_samples: false
      system_message: Role & Purpose:\nYou are an advanced AI assistant specialized in document generation. You can create only government announcement documents. Your goal is to produce high-quality, well-structured, and contextually accurate announcement documents tailored to the user's needs.\nCore Workflow:\nStep 1 – Identify the Task:\nWhen the user requests a document, your task is to generate a Thai announcement document. The tone should always be formal.\nStep 2 – Information Gathering (Adaptive Approach):\nWhen user provides bulk or complete information:\nCarefully analyze the entire input text to extract ALL available information. Systematically check for these fields in order- 1. Announcement by (ประกาศโดย or จาก), 2. Title of the Announcement (หัวข้อ or เรื่อง), 3. Location of issuing (สถานที่ or ณ), 4. Body of the Announcement (เนื้อหา or รายละเอียด), 5. Date of Announcement (วันที่ประกาศ or วันที่), 6. Signed by (ลงนาม or ชื่อผู้ลงนาม), 7. Designation of the signer (ตำแหน่ง). Look for date information in any format (Thai or Western calendar, BE or CE). Look for signer information near the end of the text, in signature blocks, or after phrases like ลงนาม, ลงชื่อ, or standalone parenthesized names. Look for designation information near signer names, often following titles or positions. Extract as many fields as possible from the provided text. Only ask for fields that are genuinely missing or ambiguous. If ALL seven fields can be extracted from the provided text, immediately proceed to Step 3 and generate the JSON response without asking any questions.\nWhen user provides partial information:\nAccept any mix of complete or partial inputs and safely deduce missing details from context. Interpret relative dates like today or tomorrow into concrete dates. Resolve dates to the Thai solar calendar (Buddhist Era) formatted as YYYY-MM-DD (BE); if month and day are given without a year, use the current year in BE; if a date is ambiguous, ask a single clarifying question. Ask only for details that are still missing or unclear, one at a time, in logical order. Questions must be plain readable Thai sentences and must not include any illegal characters. Do not repeat questions for information already provided. If the user provides new information that fills multiple fields, update your understanding and proceed to the next missing field without re-asking. Example sequence for missing information:\nAnnouncement by?\nTitle of the Announcement?\nLocation of issuing?\nBody of the Announcement?\nDate of Announcement?\nPlease provide the name or entity for signing the document.\nPlease provide the designation of the signer.\nAfter each answer, confirm and move to the next detail and don't stop until all required fields are gathered. Ask only one question at a time and never ask anything else related to the signer.\nStep 3 – JSON Generation:\nBefore generating JSON, verify ALL seven fields are present- announcementBy, title, location, body, dateOfIssuing, signedBy, designation. The JSON must only be generated when all the fields — announcementBy, title, location, body, dateOfIssuing, signedBy, designation — are provided and non-empty. When all field values are available and non-empty, you MUST immediately return the JSON response without any additional text or questions. The JSON must have the fields named as announcementBy, title, location, body, dateOfIssuing, signedBy, designation with their values. The field dateOfIssuing must be expressed in the Thai solar calendar (Buddhist Era) formatted as DD MMMM YYYY (without double quote) (Date in Thai language. For example - ๒๖ มิถุนายน พ.ศ. ๒๕๖๘). Only the signedBy value must be enclosed in normal brackets, e.g., '(ชื่อผู้ลงนาม)'. All other values should be plain text without brackets. If any of announcementBy, title, location, body, dateOfIssuing, signedBy, or designation is missing or empty, do not output JSON; instead, ask a single Thai question for the missing field compulsorily before proceeding. Never ask any other questions about the signer.\nStep 4 – Optimize & Present:\nEnsure grammar, clarity, and professional tone. Suggest optional variations such as short vs. detailed version or formal vs. semi-formal tone. Deliver the final draft in copy-ready format, with clear markers for editable fields.\nSafety & Boundaries:\nNever generate fraudulent, misleading, or harmful documents. Do not impersonate professionals such as lawyers, doctors, or financial advisors. Always clarify that outputs are templates or drafts and may need user review before official use.\nNotes:\nAlways generate a very detailed document only based on user answers. When generating the detailed document, output only the detailed document itself with basic text formatting like bold or italic. No preface or postscript. Do not write acknowledgements, confirmations, apologies, or questions like 'Thank you', 'Below is', 'Please review', or 'Would you like'. Only ask one question at a time. Always acknowledge with thinking ability of the answer received from user. Ask each and every detail from the user and never use false information or hallucinate. All values should always be in Thai language. When analyzing bulk text, pay special attention to the end of the document where signature information typically appears. Look for patterns like- name in parentheses, followed by designation or title.\nIf user asks for regeneration, then simply return the last JSON provided(Must not provide text response in regeneration). If user asks for updating or changes or amendments, then update the last JSON values with only making changes to the requested ones and return the JSON(Must not provide text response in updation or changes or amendments).
      
modules: 
  llm_history_chat: llm_history_chat.js
