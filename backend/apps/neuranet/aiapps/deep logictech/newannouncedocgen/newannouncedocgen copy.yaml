# This YAML file is the core of any AI application. The ID in the file, the file name and the hosting folder must
# match. The file documents rest of the commands and syntax.

---
id: newannouncedocgen            # the AI application name / ID
interface:                                  # the interface details
  type: announcementagentassist                    # this is for the frontend can be chat, translate or search interfaces
  label: new                       # the label for the app icon on the UI
  icon: data:image/svg+xml;base64,
  skippable_file_patterns: 
    - ^_neuranet_generated?.+
    - ^\.system?.+
endpoint: llmflow                           # the API endpoint - usually llmflow
users: ["*"]                                # the * means all users, else must be an array of user IDs
admins: ["thecompany@tekmonks.com"]         # the admins for this app - they can train for example
api_uploads_cms_path: uploads               # where files are uploaded by index, unindex APIs
generated_files_path: _neuranet_generated   # where generated files are placed
ai_cost_quota: 0.6                          # cost quota for the users, -1 disables checks also
disable_quota_checks: true                  # disable quotas if true
disable_model_usage_logging: true           # if true, ai model usage logging
default_embeddings_model: embedding-openai  # model for embedding file ingestion
ingestiondbs: ["nntfidfdb", "nnvectordb"]   # the ingestion databases

# all flows are sequence of commands which follow the same syntax - command, in, out - in is the input
# to the command, out is the variable holding the output and name points to the command module and entry
# point. the command sytax is documented below as well.

pregen_flow: 
  - command: rephrasedoc                    # entry function name is skipped as the default is generate anyways
    in: 
      label: Rephrased

      prompt: |                             # these can be prompt, prompt_docISOLanguage, prompt_fragment_fragmentISOLanguage
        Rephrase the document below with alternate keywords.
        {{{fragment}}}
      prompt_zh: |
        用替代关键词重新表述下面的文档。
        {{{fragment}}}
      prompt_ja: |
        以下の文書を別のキーワードで言い換えてください。
        {{{fragment}}}
      prompt_hi: |
        नीचे दिए गए दस्तावेज़ को वैकल्पिक कीवर्ड के साथ पुनः लिखें।
        {{{fragment}}}

      models: 
        - name: simplellm-openai
          type: chat
          model_overrides:                  # this allows us to override model params on a per AI app basis, can be a nested path e.g. driver.host if we are calling API at a different host name etc          
        - name: embedding-openai
          type: embeddings
          model_overrides:                      
      pregenfile_prefix: reworded
      pregenfile_dir: _neuranet_generated
      pregenfile_ext: txt
      encoding: utf8


llm_flow: 
  - command: llmgptchat                     # default function entry is answer so entry function name is skipped
    in: 
      session_id: "{{{request.session_id}}}" 
      auto_summary: false                   # controls session auto-summary, setting to true will lead to random errors but shorter sessions        
      question: "{{{query}}}"
      files_js: return request.files        # _js means evaluate Javascript to find the value
      aiappid: "{{{aiappid}}}"
      prompt_noinflate: |                   # means do not inflate this at the flow engine - the calling command will use it as is
        {{#files.length}}Files attached:{{/files.length}}
        {{#files}}
        Filename: {{{filename}}}
        {{{text}}}

        {{/files}}

        User's query: {{{question}}}

        Rules for Processing:

        - If the user query is a follow-up question, then you must ask another follow-up question, continuing one by one, based on how many required fields are still missing to fully answer the user query.

        - If after follow-up questioning all the fields are available in the conversation history provided, then return a JSON object containing the fields:
            announcementBy,
            title,
            location,
            body,
            procurementMethod,
            winnerName,
            awardedPrice,
            awardedPriceText,
            dateOfIssuing,
            signedBy,
            designation

          The key names in JSON must be in English exactly as written above, and the values can be in Thai language, extracted from the user.

        - If the user query already has all the complete details to create a JSON object (with no field missing or empty), then immediately return a JSON object with key-value pairs where:
            - Keys must match exactly: announcementBy, title, location, body, procurementMethod, winnerName, awardedPrice, awardedPriceText, dateOfIssuing, signedBy, designation
            - Values must be extracted directly from the user query: {{{question}}} and when extracting the values, keep the procurementMethod inside the title at the end, include the winnerName,awardedPrice,awardedPriceText inside the body.

        - If the user query {{{question}}} has incomplete data and cannot yet fill all the required fields (announcementBy, title, location, body, procurementMethod, winnerName, awardedPrice, awardedPriceText, dateOfIssuing, signedBy, designation), then ask the missing questions one at a time in logical order. Once all fields are filled from the conversation, return a JSON object containing the required fields as keys and the extracted values from the query {{{question}}} or the conversation history.

        Edge Cases:

        - If the conversation history already contains values for some fields, reuse those values together with the newly provided user input to complete the JSON.
        - If the user requests to regenerate the same document, return the last returned JSON object from conversation history unchanged.
        - If the user requests to make amendments/changes, then update the last returned JSON with only the provided changes while keeping all other existing values, and return the updated complete JSON.
        - Always ensure the final output is a valid JSON object with all required fields populated.


      prompt_th_noinflate: |
        {{#files.length}}ไฟล์ที่แนบมา:{{/files.length}}
        {{#files}}
        ชื่อไฟล์: {{{filename}}}
        {{{text}}}

        {{/files}}

        คำถามของผู้ใช้: {{{question}}}

        กฎสำหรับการประมวลผล:

          - ถ้าคำถามของผู้ใช้เป็นคำถามติดตาม (follow-up question) คุณต้องถามคำถามติดตามอีกครั้งทีละหนึ่งข้อ ขึ้นอยู่กับว่าข้อมูลที่จำเป็นยังขาดอยู่กี่ข้อ เพื่อให้สามารถตอบคำถามของผู้ใช้ได้ครบถ้วน

          - ถ้าหลังจากถามคำถามติดตามจนได้ข้อมูลครบทั้งหมดแล้ว ให้นำค่าที่ได้จากการสนทนามาสร้างเป็นวัตถุ JSON โดยต้องมีฟิลด์ดังนี้:
              announcementBy,
              title,
              location,
              body,
              procurementMethod,
              winnerName,
              awardedPrice,
              awardedPriceText,
              dateOfIssuing,
              signedBy,
              designation

            ชื่อคีย์ (key) ต้องเป็นภาษาอังกฤษตามที่กำหนดไว้เท่านั้น ส่วนค่าของฟิลด์ให้เป็นภาษาไทย ดึงข้อมูลจากผู้ใช้โดยตรง

          - ถ้าคำถามของผู้ใช้มีข้อมูลครบทั้งหมดพอดีแล้ว ให้สร้าง JSON โดยตรงทันทีด้วย key-value คู่กัน โดยมีเงื่อนไข:
              - คีย์ต้องตรงตามนี้: announcementBy, title, location, body, procurementMethod, winnerName, awardedPrice, awardedPriceText, dateOfIssuing, signedBy, designation
              - ค่าต้องนำมาจากคำถามของผู้ใช้โดยตรง
              - procurementMethod ต้องอยู่ใน title ที่ท้ายสุด
              - winnerName, awardedPrice, awardedPriceText ต้องถูกรวมเอาไว้ใน body

          - ถ้าคำถามของผู้ใช้มีข้อมูลไม่ครบและไม่สามารถกรอกฟิลด์ทั้งหมดได้ (announcementBy, title, location, body, procurementMethod, winnerName, awardedPrice, awardedPriceText, dateOfIssuing, signedBy, designation) ให้ถามคำถามเพิ่มเติมทีละหนึ่งข้ออย่างมีลำดับตรรกะ จนกว่าจะได้ข้อมูลครบ แล้วค่อยสร้าง JSON โดยรวมค่าที่เก็บจากคำถามก่อนหน้าเข้ามาด้วย

        กรณีพิเศษ:

          - ถ้าประวัติการสนทนาเดิมมีค่าของบางฟิลด์แล้ว ให้นำมาใช้ร่วมกับข้อมูลใหม่ที่ผู้ใช้เพิ่งให้ เพื่อทำให้ JSON ครบถ้วน
          - ถ้าผู้ใช้ขอสร้างเอกสารเดิมซ้ำ ให้คืนค่า JSON เดิมที่สร้างไว้ล่าสุดโดยไม่เปลี่ยนแปลง
          - ถ้าผู้ใช้ขอแก้ไข ให้ปรับเฉพาะค่าที่เปลี่ยนแปลง และคืนค่า JSON ครบถ้วนที่แก้ไขแล้ว
          - ต้องมั่นใจว่า Output ที่สุดท้ายเป็น JSON ที่ถูกต้องและมีฟิลด์ครบทุกฟิลด์ตามที่กำหนด



      model: 
        name: chat-openai
    out: airesponse                         # the final response must output to this property - airesponse for LLM flows

  - command: sanitizejson.parse                     # default function entry is answer so entry function name is skipped
    in: 
      airesponse_js: return airesponse;  
    out: airesponse
  
 
global_models:
  - name: chat-openai
    model_overrides:                    
      read_ai_response_from_samples: false
      system_message: You are an AI assistant designed to generate thai announcement documents based on user needs.\n\nYour core task is to decide whether the user query is:\n1. A follow-up answer,\n2. Has complete details to answer, or\n3. Has some incomplete data required.\n\nThe required fields are:\n- announcementBy\n- title\n- location\n- body\n- procurementMethod\n- winnerName\n- awardedPrice\n- awardedPriceText\n- dateOfIssuing\n- signedBy\n- designation\n\nAfter deciding in which direction to move next, the further steps have been mentioned in the user prompt.


modules: 
  llm_history_chat: llm_history_chat.js