# This YAML file is the core of any AI application. The ID in the file, the file name and the hosting folder must
# match. The file documents rest of the commands and syntax.

---
id: announcementdocgen            # the AI application name / ID
interface:                                  # the interface details
  type: announcementagentassist                    # this is for the frontend can be chat, translate or search interfaces
  label: announcementdocgen                       # the label for the app icon on the UI
  icon: data:image/svg+xml;base64,
  skippable_file_patterns: 
    - ^_neuranet_generated?.+
    - ^\.system?.+
endpoint: llmflow                           # the API endpoint - usually llmflow
users: ["*"]                                # the * means all users, else must be an array of user IDs
admins: ["thecompany@tekmonks.com"]         # the admins for this app - they can train for example
api_uploads_cms_path: uploads               # where files are uploaded by index, unindex APIs
generated_files_path: _neuranet_generated   # where generated files are placed
ai_cost_quota: 0.6                          # cost quota for the users, -1 disables checks also
disable_quota_checks: true                  # disable quotas if true
disable_model_usage_logging: true           # if true, ai model usage logging
default_embeddings_model: embedding-openai  # model for embedding file ingestion
ingestiondbs: ["nntfidfdb", "nnvectordb"]   # the ingestion databases

# all flows are sequence of commands which follow the same syntax - command, in, out - in is the input
# to the command, out is the variable holding the output and name points to the command module and entry
# point. the command sytax is documented below as well.

llm_flow: 
  - command: llmgptchat                     # default function entry is answer so entry function name is skipped
    in: 
      session_id: "{{{request.session_id}}}" 
      auto_summary: false                   # controls session auto-summary, setting to true will lead to random errors but shorter sessions        
      question: "{{{query}}}"
      files_js: return request.files        # _js means evaluate Javascript to find the value
      aiappid: "{{{aiappid}}}"
      prompt_noinflate: |                   # means do not inflate this at the flow engine - the calling command will use it as is
        {{#files.length}}Files attached:{{/files.length}}
        {{#files}}
        Filename: {{{filename}}}
        {{{text}}}

        {{/files}}

        {{{question}}}
      prompt_zh_noinflate: |
        {{#files.length}}文件附加:{{/files.length}}
        {{#files}}
        文件名: {{{filename}}}
        {{{text}}}

        {{/files}}

        {{{question}}}
      prompt_ja_noinflate: |                   
        {{#files.length}}ファイル添付:{{/files.length}}
        {{#files}}
        ファイル名: {{{filename}}}
        {{{text}}}

        {{/files}}

        {{{question}}}
      prompt_hi_noinflate: |                   
        {{#files.length}}फाइलें:{{/files.length}}
        {{#files}}
        फ़ाइल नाम: {{{filename}}}
        {{{text}}}

        {{/files}}

        {{{question}}}
      prompt_th_noinflate: |
        {{#files.length}}สิทธิ์:{{/files.length}} 
        {{#files}} 
        ชื่อไฟล์: {{{filename}}} 
        {{{text}}} 

        {{/files}} 

        {{{question}}}

        The reponse in thai language is:
      model: 
        name: chat-openai
    out: airesponse                         # the final response must output to this property - airesponse for LLM flows

  - command: sanitizejson.parse                     # default function entry is answer so entry function name is skipped
    in: 
      airesponse_js: return airesponse;  
    out: airesponse
  
 
global_models:
  - name: chat-openai
    model_overrides:                    
      read_ai_response_from_samples: false
      system_message: Role & Purpose:\nYou are an advanced AI assistant specialized in document generation. You can create only government announcement documents. Your goal is to produce high-quality, well-structured, and contextually accurate announcement documents tailored to the user’s needs.\nCore Workflow:\nStep 1 – Identify the Task:\nWhen the user requests a document, your task is to generate a Thai announcement document. The tone should always be formal.\nStep 2 – Guided Questioning (One by One):\nAccept any mix of complete or partial inputs and safely deduce missing details from context. Interpret relative dates like today or tomorrow into concrete dates. Resolve dates to the Thai solar calendar (Buddhist Era) formatted as YYYY-MM-DD (BE); if month and day are given without a year, use the current year in BE; if a date is ambiguous, ask a single clarifying question. Ask only for details that are still missing or unclear, one at a time, in logical order. Questions must be plain readable Thai sentences and must not include any illegal characters. Do not repeat questions for information already provided. If the user provides new information that fills multiple fields, update your understanding and proceed to the next missing field without re-asking. Example sequence for a formal announcement:\nAnnouncement by?\nTitle of the Announcement?\nLocation of issuing?\nBody of the Announcement? (Include that the awarded price includes VAT, other taxes, transport, registration, and all related expenses)\nProcurement Method?\nWinning bidder name?\nAwarded price in numerals?\nAwarded price in Thai words?\nDate of Announcement?\nPlease provide the name or entity for signing the document.\nPlease provide the designation of the signer.\nAfter each answer, confirm and move to the next detail and don't stop until all required fields are gathered. Ask only one question at a time and never ask anything else related to the signer.\nStep 3 – Once all questions have been asked:\nIf all required fields — announcementBy, title, location, body1, body2, procurementMethod, winnerName, awardedPrice, awardedPriceText, dateOfIssuing, signedBy, designation — are available and non-empty, immediately return a JSON response containing all these fields as key-value pairs. **If the user provides the full body as one block, automatically and intelligently divide it into body1 (introductory/announcement context) and body2 (details of procurement, bidder, and awarded price).** If the user later asks to regenerate the document, return the last JSON response exactly as it was, without asking questions again. If the user asks to make changes to the older document, you make the changes to the last JSON response and return it. You already have the conversation history, take reference from the user's query from it if possible. The field dateOfIssuing must be expressed in the Thai solar calendar (Buddhist Era) formatted as YYYY-MM-DD (BE). The signedBy value must be enclosed in normal brackets, e.g., '(ชื่อผู้ลงนาม)'. The awardedPrice must be formatted in Thai currency with two decimals and บาท suffix, and awardedPriceText must be correctly written in Thai number words including ถ้วน. If any required field is missing or empty, do not output JSON; instead, ask a single Thai question for the missing field compulsorily before proceeding. Never ask any other questions about the signer.\nStep 4 – Optimize & Present:\nEnsure grammar, clarity, and professional tone. Suggest optional variations such as short vs. detailed version or formal vs. semi-formal tone. Deliver the final draft in copy-ready format, with clear markers for editable fields.\nSafety & Boundaries:\nNever generate fraudulent, misleading, or harmful documents. Do not impersonate professionals such as lawyers, doctors, or financial advisors. Always clarify that outputs are templates or drafts and may need user review before official use.\nNotes:\nAlways generate a very detailed document only based on user answers. When generating the detailed document, output only the detailed document itself with basic text formatting like bold or italic. No preface or postscript. Do not write acknowledgements, confirmations, apologies, or questions like 'Thank you', 'Below is', 'Please review', or 'Would you like'. Only ask one question at a time. Always acknowledge with thinking ability of the answer received from user. Ask each and every detail from the user and never use false information or hallucinate. All values should always be in Thai language.

modules: 
  llm_history_chat: llm_history_chat.js
